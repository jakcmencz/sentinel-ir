stages:
  - test
  - publish

# tree-sitter ships native bindings, so test on every supported Node line.
unit_tests:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Python detection recall against Bandit's example findings (pinned commit).
python_recall:
  stage: test
  image: node:22
  script:
    - npm ci --cache .npm --prefer-offline
    - git clone --quiet --depth 1 --branch 1.8.6 https://github.com/PyCQA/bandit.git /tmp/bandit
    - test "$(git -C /tmp/bandit rev-parse HEAD)" = "2d0b675b04c80ae42277e10500db06a0a37bae17"
    - node scripts/python-recall.js /tmp/bandit/examples

# Exercise the post-publish verifier against already-published versions
# whenever it changes: a good release must pass, 0.5.1 (no npm publish
# attestation) must fail. Same image as publish, nothing is published.
verify_attestations:
  stage: test
  image: node:24
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - scripts/verify-attestations.js
        - .gitlab-ci.yml
  script:
    - |
      for v in 0.5.0 0.5.1 0.5.2; do
        curl -s -D - -o /tmp/a.json -H 'cache-control: no-cache' "https://registry.npmjs.org/-/npm/v1/attestations/sentinel-ir@$v" | grep -iE '^(cf-ray|cf-cache-status|age|last-modified|etag)'
        node -e 'console.log(process.argv[1], JSON.parse(require("fs").readFileSync("/tmp/a.json")).attestations.map(a => a.predicateType))' $v
      done
    - ATTEST_TIMEOUT_MS=120000 node scripts/verify-attestations.js "$(npm view sentinel-ir@latest version)"
    - |
      if out=$(ATTEST_TIMEOUT_MS=0 node scripts/verify-attestations.js 0.5.1 2>&1); then
        echo "verifier accepted 0.5.1: $out"; exit 1
      fi
      echo "$out" | grep -F "missing attestation(s): https://github.com/npm/attestation/tree/main/specs/publish/v0.1"

# Release: push a protected tag vX.Y.Z matching package.json "version".
# NPM_TOKEN is a masked, protected CI/CD variable; protected tags only.
publish:
  stage: publish
  image: node:24
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - npm ci
    - npm test
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --provenance --access public
    - node scripts/verify-attestations.js
