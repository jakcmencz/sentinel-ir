stages:
  - test
  - publish

# tree-sitter ships native bindings, so test on every supported Node line.
unit_tests:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Python detection recall against Bandit's example findings (pinned commit).
python_recall:
  stage: test
  image: node:22
  script:
    - npm ci --cache .npm --prefer-offline
    - git clone --quiet --depth 1 --branch 1.8.6 https://github.com/PyCQA/bandit.git /tmp/bandit
    - test "$(git -C /tmp/bandit rev-parse HEAD)" = "2d0b675b04c80ae42277e10500db06a0a37bae17"
    - node scripts/python-recall.js /tmp/bandit/examples

# Exercise the post-publish verifier whenever it changes, in the publish image,
# without publishing: the latest release must pass; a package that has never
# had provenance and an unpublished version must fail.
verify_attestations:
  stage: test
  image: node:24
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - changes:
        - scripts/verify-attestations.js
        - .gitlab-ci.yml
  script:
    - ATTEST_TIMEOUT_MS=120000 node scripts/verify-attestations.js "$(npm view sentinel-ir@latest version)"
    - |
      for bad in left-pad@1.3.0 0.0.0-unpublished; do
        if out=$(ATTEST_TIMEOUT_MS=0 node scripts/verify-attestations.js "$bad" 2>&1); then
          echo "verifier accepted $bad: $out"; exit 1
        fi
        echo "$out" | grep -F "missing attestation(s): https://github.com/npm/attestation/tree/main/specs/publish/v0.1, https://slsa.dev/provenance/v0.2"
      done

# Release: push a protected tag vX.Y.Z matching package.json "version".
# NPM_TOKEN is a masked, protected CI/CD variable; protected tags only.
publish:
  stage: publish
  image: node:24
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - npm ci
    - npm test
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --provenance --access public
    - node scripts/verify-attestations.js
